name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # The org blocks the default GITHUB_TOKEN from creating pull requests, so
      # this needs a fine-grained PAT scoped to this repo (Contents: write,
      # Pull requests: write) stored as the RELEASE_PLEASE_TOKEN secret.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Publishing to npm is a separate, manually-triggered step — see
  # publish.yml. Keeping one workflow file as the sole npm publisher means
  # only one Trusted Publisher entry to configure and keep in sync.
