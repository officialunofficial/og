name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs a recent npm CLI; the runner's default may lag.
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      - name: Assert tag matches package version
        if: github.event_name == 'release'
        run: |
          test "v$(jq -r .version package.json)" = "${GITHUB_REF_NAME}" \
            || { echo "package.json version does not match tag ${GITHUB_REF_NAME}"; exit 1; }
      - run: npm publish --access public
